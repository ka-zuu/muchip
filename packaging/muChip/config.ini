; muChip config.ini (パッケージ同梱の初期値)
;
; 実機では mux_launch.sh が --config <APP_DIR>/config.ini を渡すので、この
; ファイルが読み書きされる。muchip は終了時にオートセーブするため、初回終了時に
; config.c が丸ごと書き直し、ここのコメントは失われる(値は保持される)。
;
; 値は src/config.c の config_set_defaults() と同じにしてある。同梱する意味は
; 「初回起動前でも実機で設定を手編集できる」ことと、[input] の既定を明示して
; おくことにある。
;
; last_path は空にしておく。空のときだけ mux_launch.sh が自動検出した音楽
; フォルダ (MUCHIP_START_DIR) から始まり、以後は前回開いた場所が入る (F-13)。

[playback]
default_length_sec = 180
length_override_sec = 0
skip_short_sec = 0
fade_length_ms = 8000
repeat_mode = all
shuffle = false
sample_rate = 44100

[audio]
stereo_depth = 0.150
eq_bass = 0
eq_treble = 0

[ui]
show_all_files = false
title_scroll = true
battery_show = low
theme = midnight
last_path =

; Issue #27: theme が "custom" のときだけ、ここの9色が実効値になる。
; 値は RRGGBB の16進(先頭#無し)。ここではmidnightと同じ値にしてある
; (Edit theme画面を一度も開かなくても妥当な色が入っているように)。
[theme]
bg = 12121a
panel = 1e1e2a
fg = e6e6e6
dim = 9696a0
accent = 78b4ff
sel = 3c5aa0
mark = ffd25a
warn = ff785a
ok = 78dc8c

; muOS実機の物理ボタンは、SDLのゲームコントローラDBが読み込まれていれば
; SDL_GameController として認識される。muOSは /usr/lib/gamecontrollerdb.txt を
; 同梱している。mux_launch.sh 側でも SDL_GAMECONTROLLERCONFIG_FILE を保証して
; いるので二重化になっている。
; controller_mapping はDBに載っていない機種向けの追加マッピング1行
; (SDL_GameControllerAddMapping形式)。GUIDは起動時のログ(log.txt)に出る。
[input]
gamecontroller_db = /usr/lib/gamecontrollerdb.txt
controller_mapping =

; muOS のアプリ一覧に出す表示名とヘルプ。 (SPEC 9.3)
; frontend/module/muxapp.c が [full]/[grid]/[help] の各セクションを言語名で引く。
; 言語名は /opt/muos/share/language/*.json のファイル名と同じ綴りで、
; "English" / "Japanese" が正しいキー。このファイルが見つからない場合は
; ディレクトリ名 (muChip) と mux_launch.sh の "# GRID: " / "# HELP: " に
; フォールバックする。

[full]
English=muChip Player
Japanese=muChip プレーヤー

[grid]
English=muChip
Japanese=muChip

[help]
English=A chiptune (GBS/NSF/SPC) player with full sub-track and extended M3U support.
Japanese=GBS/NSF/SPC対応、サブトラックと拡張M3Uに正しく対応したchiptuneプレーヤーです。
